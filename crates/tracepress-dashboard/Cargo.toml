[package]
name = "tracepress-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["web"]
web = ["dioxus/web"]

[[bin]]
name = "tracepress-dashboard"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
tracepress-dashboard-types = { path = "../tracepress-dashboard-types" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-subscriber = "0.3"
tracing-wasm = "0.2"

[dev-dependencies]
dioxus-ssr = "0.7"

[lints]
workspace = true
