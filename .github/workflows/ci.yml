name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    name: Minimum supported Rust 1.88
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.88.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Compile all workspace targets on the MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  required-gates:
    name: Required gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned test runner
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: cargo-nextest@0.9.145

      - name: Validate locked dependency metadata
        run: cargo metadata --locked --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo nextest run --workspace --all-features --locked --profile ci

      - name: Run documentation tests
        run: cargo test --workspace --all-features --locked --doc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      - name: Build workspace
        run: cargo build --workspace --all-features --locked

  windows-compile-only:
    name: Portable crates compile on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    # The CLI and daemon are Unix-only runtime surfaces. Windows checks the portable libraries.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Compile workspace targets
        run: >-
          cargo check --workspace --all-targets --all-features --locked
          --exclude tracepress-cli --exclude tracepress-daemon

  observatory-web:
    name: Observatory WASM and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain with WASM target
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Compile dashboard for WASM
        run: cargo build -p tracepress-dashboard --target wasm32-unknown-unknown --release --locked

      - name: Install matching Dioxus CLI
        env:
          DIOXUS_CLI_VERSION: 0.7.10
          DIOXUS_CLI_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7
        run: |
          set -euo pipefail
          archive="dx-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/DioxusLabs/dioxus/releases/download/v${DIOXUS_CLI_VERSION}/${archive}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${DIOXUS_CLI_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir --parents "${RUNNER_TEMP}/dioxus-cli"
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}/dioxus-cli"
          install "${RUNNER_TEMP}/dioxus-cli/dx" "${HOME}/.cargo/bin/dx"
          dx --version

      - name: Build static Observatory assets
        working-directory: crates/tracepress-dashboard
        run: dx build --package tracepress-dashboard --platform web --release
