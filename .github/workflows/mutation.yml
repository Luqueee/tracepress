name: Mutation testing

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to mutate
        required: true
        default: tracepress-core
        type: choice
        options:
          - tracepress-core
          - tracepress-provider
          - tracepress-compression
      shard:
        description: Deterministic eighth of the package mutation set
        required: true
        default: 0/8
        type: choice
        options:
          - 0/8
          - 1/8
          - 2/8
          - 3/8
          - 4/8
          - 5/8
          - 6/8
          - 7/8

concurrency:
  group: ${{ github.workflow }}-${{ inputs.package }}-${{ inputs.shard }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutants:
    name: ${{ inputs.package }} shard ${{ inputs.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MUTATION_PACKAGE: ${{ inputs.package }}
      MUTATION_SHARD: ${{ inputs.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false

      - name: Install pinned mutation and test runners
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.145

      - name: Verify the unmodified package
        run: cargo nextest run --package "$MUTATION_PACKAGE" --all-features --locked

      - name: Test mutation shard
        run: |
          cargo mutants \
            --package "$MUTATION_PACKAGE" \
            --all-features \
            --shard "$MUTATION_SHARD" \
            --baseline skip \
            --test-tool nextest \
            --timeout 300 \
            --build-timeout 300 \
            --cargo-arg=--locked \
            --output mutants-output

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ inputs.package }}-${{ github.run_attempt }}
          path: mutants-output
          if-no-files-found: warn
          retention-days: 14
