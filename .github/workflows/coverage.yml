name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Workspace coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain with coverage support
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install pinned coverage tool
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Collect workspace coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --locked --no-report -- \
            --skip block_limit_preserves_maximum_prefix_after_structural_owner_slots \
            --skip context_queue_overflow_drops_only_analysis_after_all_provider_receipts_commit \
            --skip semantic_request_parsing_never_delays_upstream_dispatch \
            --skip semantic_response_parsing_never_occupies_the_runtime_worker

      - name: Generate coverage reports
        run: |
          cargo llvm-cov report --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --workspace --summary-only --fail-under-lines 80 | tee coverage-summary.txt

      - name: Publish coverage summary
        run: |
          {
            echo '## Rust coverage'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: |
            coverage-summary.txt
            lcov.info
          if-no-files-found: error
          retention-days: 14
