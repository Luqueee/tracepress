[package]
name = "tracepress-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
fuzz-tests = []

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11"
serde_json = "1"
